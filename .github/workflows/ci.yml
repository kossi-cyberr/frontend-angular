name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Tests unitaires (Karma / ChromeHeadless)
        run: npm test -- --watch=false --browsers=ChromeHeadless
        env:
          CHROME_BIN: /usr/bin/google-chrome

      # Le build production (AOT + optimisations + inlining des polices) est le
      # vrai gate de régression, identique à l'étape du Dockerfile.
      - name: Build production (ng build)
        run: npm run build
